services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: booktrail-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CDS_ENV=production
    volumes:
      - booktrail_data:/data
    expose:
      - "4004"
    networks:
      - web

volumes:
  booktrail_data:

networks:
  web:
    name: web
    external: true
